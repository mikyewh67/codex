name: Generate lesson audio
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ledger-audio-generation
  cancel-in-progress: false
jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audio encoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Generate reviewed lesson scripts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-audio.mjs
      - name: Save audio files to the site
        run: |
          git config user.name 'Ledger Audio'
          git config user.email 'ledger-audio@users.noreply.github.com'
          git add audio/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate AI narrated accounting lessons'
          git pull --rebase origin main
          git push origin HEAD:main
